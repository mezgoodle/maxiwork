image: node:18

stages:
  - build
  - lint
  - test

variables:
  BACKEND_DIR: "backend"
  FRONTEND_DIR: "frontend"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ${BACKEND_DIR}/node_modules/
    - ${FRONTEND_DIR}/node_modules/
    - ${FRONTEND_DIR}/.nuxt/ # Кешуємо директорію .nuxt

.build: &build
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR
    - npm install
    - npm run build

.lint: &lint
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR
    - npm run lint

.test: &test
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR
    - npm run test

backend_build:
  stage: build
  variables:
    APP_DIR: ${BACKEND_DIR}
  <<: *build

frontend_build:
  stage: build
  variables:
    APP_DIR: ${FRONTEND_DIR}
  <<: *build

backend_lint:
  stage: lint
  variables:
    APP_DIR: ${BACKEND_DIR}
  <<: *lint

frontend_lint:
  stage: lint
  variables:
    APP_DIR: ${FRONTEND_DIR}
  <<: *lint

backend_test:
  stage: test
  variables:
    APP_DIR: ${BACKEND_DIR}
  <<: *test

frontend_test:
  stage: test
  variables:
    APP_DIR: ${FRONTEND_DIR}
  needs: ["frontend_build"] # Залежність від збірки фронтенду
  <<: *test
