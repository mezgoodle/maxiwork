image: node:20-alpine

stages:
  - lint
  - test

.lint_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

lint:backend:
  stage: lint
  extends: .lint_rules
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - set -o pipefail
    - npm run lint 2>&1 | tee eslint-report.txt
  artifacts:
    when: on_success
    paths:
      - backend/eslint-report.txt

lint:frontend:
  stage: lint
  extends: .lint_rules
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
      - frontend/.nuxt/
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - set -o pipefail
    - npm run lint 2>&1 | tee eslint-report.txt
  artifacts:
    when: on_success
    paths:
      - frontend/eslint-report.txt
